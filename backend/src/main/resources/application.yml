spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nowtify}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
